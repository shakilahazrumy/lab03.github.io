<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="description"	content="Lab 01 Tutorial">
	<meta name="keywords"		content="HTML, CSS JavaScript">	
	<meta name="author"			content="Shakila Hazrumy">
	<title> CWA Help Desk Appointment </title>
</head>
<body>
    <a href="http://www.swin.edu.au"><img src="logo.png" alt="swinburne logo"></a>
    <h1>CWA Help Desk Appointment</h1>
    <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
    <p>Check Blackboard for when CWA tutors will be there</p>
    <fieldset>
        <legend>Student details</legend>
        <p>
            <label for="studentid">Student ID</label> 
            <input type="text" name="studentid" id="studentid" minlength="7" maxlength="10">
        </p>
        <p>
            <label for="givenname">Given Name</label>
            <input type="text" name="givenname" id="givenname" maxlength="15">
            <label for="familyname">Family Name</label>
            <input type="text" name="familyname" id="familyname" maxlength="15">
        </p>
    </fieldset>
    <fieldset>
    <legend>Your unit</legend>
        <p>
            <input type="radio" id="COS10011" name="unit" value="COS10011">
            <label for="COS10011">COS10011</label>
            <input type="radio" id="COS60004" name="unit" value="COS60004">
            <label for="COS60004">COS60004</label>
            <input type="radio" id="COS60007" name="unit" value="COS60007">
            <label for="COS60007">COS60007</label>
        </p>
        <p>
            <label for="tutorname">Your Tutor</label>
            <select name="tutorname" id="tutorname" required="required">
                <option value="">Please Select</option>
                <option value="name1">Teacher name 1</option>
                <option value="name2">Teacher name 2</option>
                <option value="name3">Teacher name 3</option>
            </select>
        </p>
    </fieldset>
    <fieldset>
        <legend>Issue</legend>
            <p>
                <label for="html">HTML</label>
                <input type="checkbox" id="html" name="issue" value="html">
                <label for="css">CSS</label>
                <input type="checkbox" id="css" name="issue" value="css">
                <label for="javascript">JavaScript</label>
                <input type="checkbox" id="javascript" name="issue" value="javascript">
                <label for="php">PHP</label>
                <input type="checkbox" id="php" name="issue" value="php">
                <label for="mysql">MySQL</label>
                <input type="checkbox" id="mysql" name="issue" value="mysql">
            </p>
            <p>
                <label for="description">Description of Issue</label>
                <br>
                <textarea id="description" name="description" placeholder="write description of your problem here..."></textarea>
            </p>
    </fieldset>
    <fieldset>
        <legend>Preferred Date/Time</legend>
        <p>
            <label for="date">Date</label> 
			<input type="date" name= "date" id="date">
		</p>
        <p>
            <label for="time">Time</label>
            <input type="time" name="time" id="time" size="10">
        </p>
    </fieldset>
    <input type= "submit" value="Register">
	<input type= "reset" value="Reset Form">
</body>
</html>
